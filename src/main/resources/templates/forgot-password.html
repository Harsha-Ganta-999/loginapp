<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; margin-bottom: 8px; color: #333; }
        p.subtitle { text-align: center; color: #888; margin-bottom: 28px; font-size: 14px; }
        input {
            width: 100%; padding: 12px 16px; margin-bottom: 16px;
            border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none;
        }
        input:focus { border-color: #667eea; }
        button {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; cursor: pointer; font-weight: 600;
        }
        .back { text-align: center; margin-top: 16px; font-size: 14px; }
        .back a { color: #667eea; text-decoration: none; }
        .error { background: #ffe0e0; color: #c0392b; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your username and new password</p>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form method="post" action="/forgot-password">
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="newPassword" placeholder="New Password" required />
        <button type="submit">Reset Password</button>
    </form>

    <div class="back"><a href="/login">← Back to Login</a></div>
</div>
</body>
</html>
